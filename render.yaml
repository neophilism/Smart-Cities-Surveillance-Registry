# Retained for future owner-authorized deployment only.
# The former Smart Cities Render web service and preview were intentionally
# deleted on 2026-10-13 to conserve Render slots. Do not reapply this Blueprint
# without authorization. Development and CircleCI continue normally.
services:
  - type: web
    name: smart-cities-surveillance-registry
    runtime: docker
    region: ohio
    plan: free
    repo: https://github.com/neophilism/Smart-Cities-Surveillance-Registry
    branch: main
    dockerfilePath: ./Dockerfile
    dockerContext: .
    autoDeployTrigger: checksPass
    healthCheckPath: /api/ready
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_URL_UNPOOLED
        sync: false
      - key: CIVIC_REGISTRY_ADMIN_TOKEN
        sync: false
      - key: NODE_ENV
        value: production
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
